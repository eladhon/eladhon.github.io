name: Sync portfolio data

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update portfolio.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: eladhon
        run: node scripts/sync-portfolio.mjs

      - name: Commit updated portfolio.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio.json
          if git diff --cached --quiet; then
            echo "portfolio.json is already up to date."
          else
            git commit -m "chore: update portfolio data"
            git push
          fi
